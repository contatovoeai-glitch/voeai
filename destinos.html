<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%23050505%22%2F%3E%3Cpath%20d%3D%22M12%203.4%20L20.6%2020.4%20L12%2016%20L3.4%2020.4%20Z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Cpath%20d%3D%22M12%203.4%20L12%2016%20L3.4%2020.4%20Z%22%20fill%3D%22%235574FF%22%2F%3E%3C%2Fsvg%3E">

<style>
  html { scroll-behavior:smooth; }
  body { margin:0; background:#050505; color:#F4F4F1; font-family:'Schibsted Grotesk','Helvetica Neue',Helvetica,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a { color:#5574FF; text-decoration:none; }
  a:hover { color:#7C93FF; }
  ::selection { background:rgba(85,116,255,.28); }
  input::placeholder { color:#969CA5; }
  :focus-visible { outline:2px solid #5574FF; outline-offset:3px; }
  image-slot { --slot-radius:0; }
  /* slot com src ja preenchido pelo autor: sem anel tracejado de drop-zone */
  image-slot[src]::part(ring) { display:none !important; }
  @keyframes rise { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
  [data-menu-btn] { display:none; }
  @media (max-width:1024px) { header nav { display:none !important; } [data-menu-btn] { display:grid !important; } }
  @media (max-width:600px) {
    [data-hdr-login] { display:none !important; }
    [data-hdr-cta] { padding:0 13px !important; font-size:10px !important; letter-spacing:.08em !important; }
    header > div:nth-of-type(2) { gap:12px !important; }
  }
  @media (max-width:1080px) {
    [data-g12] { grid-template-columns:1fr !important; }
    [data-g12] > * { grid-column:auto !important; }
    [data-editorial] { grid-template-columns:1fr !important; grid-auto-rows:auto !important; }
    [data-editorial] > * { grid-column:auto !important; grid-row:auto !important; aspect-ratio:4/3 !important; }
    [data-split] { grid-template-columns:1fr !important; }
  }
  [data-split] > *, [data-story] > *, [data-two] > *, [data-g12] > *, [data-row] > * { min-width:0; }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; } html { scroll-behavior:auto; } }
  /* === grade de blocos (gerado) ===
     auto-fit deixava o browser escolher as colunas e sobrava linha orfa
     com borda solta. Colunas explicitas por faixa; divisor a esquerda,
     removido no primeiro de cada linha, e respiro para o texto nao colar. */
  [data-cols] > * { min-width:0; }
  [data-cols][data-div] > * { border-right:0 !important; padding-left:clamp(18px,1.7vw,34px) !important; }
  [data-div="d"] > * { border-left:1px solid rgba(255,255,255,.08) !important; }
  [data-div="l"] > * { border-left:1px solid rgba(5,5,5,.12) !important; }
  @media (min-width:1240px) {
    [data-cols="3"] { grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
    [data-cols="3"][data-div] > :nth-child(3n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="4"] { grid-template-columns:repeat(4,minmax(0,1fr)) !important; }
    [data-cols="4"][data-div] > :nth-child(4n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="5"] { grid-template-columns:repeat(5,minmax(0,1fr)) !important; }
    [data-cols="5"][data-div] > :nth-child(5n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="6"] { grid-template-columns:repeat(6,minmax(0,1fr)) !important; }
    [data-cols="6"][data-div] > :nth-child(6n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="7"] { grid-template-columns:repeat(7,minmax(0,1fr)) !important; }
    [data-cols="7"][data-div] > :nth-child(7n+1) { border-left:0 !important; padding-left:0 !important; }
  }
  @media (min-width:900px) and (max-width:1239px) {
    [data-cols="3"] { grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
    [data-cols="3"][data-div] > :nth-child(3n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="4"] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    [data-cols="4"][data-div] > :nth-child(2n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="5"] { grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
    [data-cols="5"][data-div] > :nth-child(3n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="6"] { grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
    [data-cols="6"][data-div] > :nth-child(3n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="7"] { grid-template-columns:repeat(4,minmax(0,1fr)) !important; }
    [data-cols="7"][data-div] > :nth-child(4n+1) { border-left:0 !important; padding-left:0 !important; }
  }
  @media (min-width:600px) and (max-width:899px) {
    [data-cols="3"] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    [data-cols="3"][data-div] > :nth-child(2n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="4"] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    [data-cols="4"][data-div] > :nth-child(2n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="5"] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    [data-cols="5"][data-div] > :nth-child(2n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="6"] { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
    [data-cols="6"][data-div] > :nth-child(2n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="7"] { grid-template-columns:repeat(3,minmax(0,1fr)) !important; }
    [data-cols="7"][data-div] > :nth-child(3n+1) { border-left:0 !important; padding-left:0 !important; }
  }
  @media (max-width:599px) {
    [data-cols="3"] { grid-template-columns:repeat(1,minmax(0,1fr)) !important; }
    [data-cols="3"][data-div] > :nth-child(1n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="4"] { grid-template-columns:repeat(1,minmax(0,1fr)) !important; }
    [data-cols="4"][data-div] > :nth-child(1n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="5"] { grid-template-columns:repeat(1,minmax(0,1fr)) !important; }
    [data-cols="5"][data-div] > :nth-child(1n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="6"] { grid-template-columns:repeat(1,minmax(0,1fr)) !important; }
    [data-cols="6"][data-div] > :nth-child(1n+1) { border-left:0 !important; padding-left:0 !important; }
    [data-cols="7"] { grid-template-columns:repeat(1,minmax(0,1fr)) !important; }
    [data-cols="7"][data-div] > :nth-child(1n+1) { border-left:0 !important; padding-left:0 !important; }
  }
  /* === fim grade de blocos === */
</style>
</helmet>

<div style="position:relative;background:#050505">
  <dc-import name="Header" active="destinos" hint-size="100%,76px"></dc-import>

  <section style="position:relative;min-height:clamp(420px,72vh,760px);display:flex;align-items:flex-end;overflow:hidden;background:#050505">
    <div style="position:absolute;inset:0"><image-slot id="dst-hero" src="uploads/dst-hero.webp" shape="rect" fit="cover" placeholder="MAPA-MÚNDI FOTOGRÁFICO OU CIDADE VISTA DO AVIÃO · 2560×1400"></image-slot></div>
    <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,5,5,.72) 0%,rgba(5,5,5,.3) 42%,rgba(5,5,5,.94) 100%)"></div>
    <div style="position:relative;width:100%;max-width:1560px;margin:0 auto;padding:150px clamp(20px,4vw,64px) clamp(48px,6vw,88px)">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:30px"><span style="width:32px;height:1px;background:#5574FF"></span><span style="font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.3em;color:#C9CDD3;white-space:nowrap">CATÁLOGO DE DESTINOS</span></div>
      <h1 style="margin:0;font:300 clamp(40px,6.2vw,92px)/1 'Schibsted Grotesk',sans-serif;letter-spacing:-.042em;color:#FFFFFF">Para onde você quer ir?</h1>
    </div>
  </section>

  <section style="position:relative;background:#111419;padding:clamp(20px,2.4vw,32px) clamp(20px,4vw,64px)">
    <div data-split="1" style="max-width:1560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:clamp(14px,2vw,32px);align-items:end">
      <label style="display:block;min-width:0"><span style="display:block;font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;color:#747B85;margin-bottom:12px;white-space:nowrap">DESTINO</span><input value="{{ q }}" onChange="{{ setQ }}" placeholder="Cidade ou país" style="width:100%;height:44px;border:none;border-bottom:1px solid rgba(255,255,255,.16);background:transparent;color:#FFFFFF;font:400 16px/1 'Schibsted Grotesk',sans-serif"></label>
      <label style="display:block;min-width:0"><span style="display:block;font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;color:#747B85;margin-bottom:12px;white-space:nowrap">ORIGEM</span><select style="width:100%;height:44px;border:none;border-bottom:1px solid rgba(255,255,255,.16);background:transparent;color:#FFFFFF;font:400 16px/1 'Schibsted Grotesk',sans-serif;appearance:none;cursor:pointer"><option style="background:#111419">São Paulo (GRU)</option><option style="background:#111419">Rio de Janeiro (GIG)</option><option style="background:#111419">Brasília (BSB)</option><option style="background:#111419">Porto Alegre (POA)</option></select></label>
      <label style="display:block;min-width:0"><span style="display:block;font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.22em;color:#747B85;margin-bottom:12px;white-space:nowrap">DATA</span><input type="date" style="width:100%;height:44px;border:none;border-bottom:1px solid rgba(255,255,255,.16);background:transparent;color:#FFFFFF;font:400 16px/1 'Schibsted Grotesk',sans-serif;color-scheme:dark"></label>
      <a href="cotacao.html" style="display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 26px;border-radius:9px;background:#5574FF;color:#FFFFFF;font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.13em;white-space:nowrap" style-hover="background:#7C93FF">BUSCAR</a>
    </div>
  </section>

  <section style="position:relative;background:#FFFFFF;color:#050505;padding:clamp(56px,6vw,96px) clamp(20px,4vw,64px) clamp(80px,9vw,150px)">
    <div style="max-width:1560px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;padding-bottom:26px;margin-bottom:clamp(20px,2.4vw,34px);border-bottom:1px solid rgba(5,5,5,.14)">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="10"><button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <span style="font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#969CA5;white-space:nowrap">{{ count }} DESTINOS</span>
          <select value="{{ sort }}" onChange="{{ setSort }}" style="height:34px;border:none;background:transparent;color:#3A3F47;font:400 12.5px/1 'Schibsted Grotesk',sans-serif;appearance:none;cursor:pointer"><option>Mais procurados</option><option>Nome A–Z</option><option>Menor tempo de voo</option></select>
        </div>
      </div>

      <div data-editorial="1" style="display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(110px,9.5vw,160px);grid-auto-flow:row dense;gap:clamp(10px,1.1vw,16px)">
        <sc-for list="{{ destinos }}" as="d" hint-placeholder-count="12">
          <a href="destino.html" onMouseEnter="{{ d.enter }}" onMouseLeave="{{ d.leave }}" style="{{ d.card }}">
            <div style="position:absolute;inset:0;overflow:hidden;border-radius:14px"><div style="{{ d.zoom }}"><image-slot id="{{ d.slot }}" src="{{ d.src }}" shape="rect" fit="cover" placeholder="{{ d.hint }}"></image-slot></div></div>
            <div aria-hidden="true" style="{{ d.scrim }}"></div>
            <div style="position:relative;z-index:2;margin-top:auto;padding:clamp(16px,1.7vw,24px);pointer-events:none">
              <div style="{{ d.name }}">{{ d.city }}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:14px">
                <span style="font:400 11.5px/1 'Schibsted Grotesk',sans-serif;color:rgba(255,255,255,.72);white-space:nowrap">{{ d.country }}</span>
                <span style="{{ d.meta }}">{{ d.flight }}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>

      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding:clamp(48px,6vw,90px) 0;border-top:1px solid rgba(5,5,5,.14)">
          <div style="font:300 clamp(22px,2.4vw,32px)/1.2 'Schibsted Grotesk',sans-serif;letter-spacing:-.03em;color:#969CA5;max-width:24ch;margin-bottom:24px">Nenhum destino nesse filtro.</div>
          <a href="cotacao.html" style="display:inline-flex;align-items:center;gap:11px;height:48px;padding:0 24px;border-radius:9px;border:1px solid rgba(5,5,5,.18);color:#050505;font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.13em;white-space:nowrap" style-hover="background:#050505;color:#FFFFFF">COTAR OUTRA ROTA</a>
        </div>
      </sc-if>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,700px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const CATS = ['Todos', 'Internacionais', 'Brasil', 'Europa', 'Estados Unidos', 'Ásia', 'Praia', 'Família', 'Luxo', 'Negócios'];
const D = [
  ['MIAMI', 'Estados Unidos', 'miami', 'SKYLINE / OCEAN DRIVE', 8.7, 7, 3, 1, ['Internacionais', 'Estados Unidos', 'Praia', 'Família']],
  ['LISBOA', 'Portugal', 'lisboa', 'CIDADE / RIO / ARQUITETURA', 9.75, 5, 3, 2, ['Internacionais', 'Europa', 'Negócios', 'Família']],
  ['PARIS', 'França', 'paris', 'ARQUITETURA SOFISTICADA', 11.3, 4, 2, 3, ['Internacionais', 'Europa', 'Luxo']],
  ['DUBAI', 'Emirados Árabes', 'dubai', 'SKYLINE AO ENTARDECER', 14.5, 8, 2, 4, ['Internacionais', 'Ásia', 'Luxo']],
  ['NOVA YORK', 'Estados Unidos', 'ny', 'SKYLINE EDITORIAL', 9.8, 4, 2, 5, ['Internacionais', 'Estados Unidos', 'Negócios']],
  ['ORLANDO', 'Estados Unidos', 'orlando', 'EXPERIÊNCIA / CIDADE', 8.9, 4, 2, 6, ['Internacionais', 'Estados Unidos', 'Família']],
  ['ROMA', 'Itália', 'roma', 'ARQUITETURA / LUZ NATURAL', 11.1, 4, 2, 7, ['Internacionais', 'Europa', 'Luxo']],
  ['LONDRES', 'Reino Unido', 'londres', 'CIDADE CONTEMPORÂNEA', 11.25, 6, 2, 8, ['Internacionais', 'Europa', 'Negócios']],
  ['MADRI', 'Espanha', 'madri', 'ARQUITETURA URBANA', 10.1, 6, 2, 9, ['Internacionais', 'Europa', 'Negócios']],
  ['BARCELONA', 'Espanha', 'barcelona', 'COSTA / ARQUITETURA', 10.5, 5, 2, 10, ['Internacionais', 'Europa', 'Praia']],
  ['CANCÚN', 'México', 'cancun', 'LITORAL EDITORIAL', 9.4, 7, 2, 11, ['Internacionais', 'Praia', 'Família']],
  ['TÓQUIO', 'Japão', 'toquio', 'CIDADE / NOITE', 24.0, 6, 2, 12, ['Internacionais', 'Ásia', 'Luxo']],
  ['BUENOS AIRES', 'Argentina', 'buenos', 'ARQUITETURA CLÁSSICA', 2.9, 6, 2, 13, ['Internacionais', 'Negócios']],
  ['RIO DE JANEIRO', 'Brasil', 'rio', 'PAISAGEM URBANA', 1.1, 6, 2, 14, ['Brasil', 'Praia', 'Família']],
  ['FERNANDO DE NORONHA', 'Brasil', 'noronha', 'LITORAL EDITORIAL', 4.5, 6, 2, 15, ['Brasil', 'Praia', 'Luxo']],
  ['SALVADOR', 'Brasil', 'salvador', 'CIDADE HISTÓRICA', 2.3, 4, 2, 16, ['Brasil', 'Praia', 'Família']],
  ['FLORIANÓPOLIS', 'Brasil', 'floripa', 'COSTA / LUZ NATURAL', 1.2, 4, 2, 17, ['Brasil', 'Praia', 'Família']],
  ['SANTIAGO', 'Chile', 'santiago', 'CIDADE / CORDILHEIRA', 4.1, 4, 2, 18, ['Internacionais', 'Família']]
].map(a => ({ city: a[0], country: a[1], slot: a[2], art: a[3], hours: a[4], c: a[5], r: a[6], rank: a[7], cats: a[8], flight: Math.floor(a[4]) + 'h ' + String(Math.round((a[4] % 1) * 60)).padStart(2, '0') }));

class Component extends DCLogic {
  state = { cat: 'Todos', q: '', sort: 'Mais procurados', hov: null };
  renderVals() {
    const { cat, q, sort, hov } = this.state;
    const term = q.trim().toLowerCase();
    let list = D.filter(d => (cat === 'Todos' || d.cats.indexOf(cat) > -1) && (!term || (d.city + ' ' + d.country).toLowerCase().indexOf(term) > -1));
    if (sort === 'Nome A–Z') list = list.slice().sort((a, b) => a.city.localeCompare(b.city));
    else if (sort === 'Menor tempo de voo') list = list.slice().sort((a, b) => a.hours - b.hours);
    else list = list.slice().sort((a, b) => a.rank - b.rank);
    return {
      q: q, sort: sort, count: String(list.length).padStart(2, '0'), empty: list.length === 0,
      setQ: e => this.setState({ q: e.target.value }),
      setSort: e => this.setState({ sort: e.target.value }),
      cats: CATS.map(c => ({
        label: c, pick: () => this.setState({ cat: c }),
        style: 'height:34px;padding:0 15px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .3s ease;font:500 9.5px/1 \'IBM Plex Mono\',monospace;letter-spacing:.15em;text-transform:uppercase;border:1px solid ' + (c === cat ? '#050505' : 'rgba(5,5,5,.16)') + ';background:' + (c === cat ? '#050505' : 'transparent') + ';color:' + (c === cat ? '#FFFFFF' : '#747B85')
      })),
      destinos: list.map(d => {
        const h = hov === d.city;
        return {
          city: d.city, country: d.country, flight: d.flight, slot: 'dst-' + d.slot, src: 'uploads/cidade-' + d.slot + '.webp', hint: d.city + ' · ' + d.art,
          enter: () => this.setState({ hov: d.city }), leave: () => this.setState({ hov: null }),
          card: 'position:relative;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#111419;color:inherit;grid-column:span ' + d.c + ';grid-row:span ' + d.r,
          zoom: 'position:absolute;inset:0;transition:transform .9s cubic-bezier(.16,1,.3,1);transform:scale(' + (h ? 1.025 : 1) + ')',
          scrim: 'position:absolute;inset:0;pointer-events:none;transition:opacity .45s ease;background:linear-gradient(180deg,rgba(5,5,5,0) 44%,rgba(5,5,5,.72) 88%,rgba(5,5,5,.88));opacity:' + (h ? 1 : .85),
          name: 'font:300 clamp(19px,1.8vw,28px)/1 \'Schibsted Grotesk\',sans-serif;letter-spacing:-.035em;color:#FFFFFF;margin-bottom:8px;transition:transform .45s cubic-bezier(.16,1,.3,1);transform:translateY(' + (h ? '-5px' : '0') + ')',
          meta: 'font:400 10.5px/1 \'IBM Plex Mono\',monospace;letter-spacing:.12em;white-space:nowrap;transition:opacity .4s ease;color:rgba(255,255,255,.85);opacity:' + (h ? 1 : 0)
        };
      })
    };
  }
}
</script>
</body>
</html>
